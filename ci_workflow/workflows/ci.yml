name: AnnRakshak AI CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black

      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      - name: Code Quality & Lint Checks
        run: |
          ruff check .
          black --check --diff . || echo "Black diff detected; review styling"

      - name: Run Core Test Suite (Phases P0 - P3)
        run: |
          python -m unittest test_p0_a_auth.py
          python -m unittest test_p0_b_backend.py
          python -m unittest test_p0_c_build_and_data.py
          python -m unittest test_security_p0.py
          python -m unittest test_integrity_p1.py
          python -m unittest test_workflow.py
          python -m unittest test_intelligence_p2.py
          python -m unittest test_engineering_p3.py

      - name: Launch Streamlit & Run Playwright UI Contrast Audit
        env:
          DEMO_MODE: "true"
        run: |
          streamlit run app.py --server.headless true --server.port 8501 &
          sleep 5
          python test_playwright_contrast.py
